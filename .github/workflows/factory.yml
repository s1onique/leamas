# Factory CI - Runs Factory quality gates on pull requests and protected branches
name: Factory

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  factory-fast:
    name: Factory Fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Topology snapshot
        # Make the checkout topology visible so CI failures can be
        # diagnosed against an explicit depth, branch, and worktree
        # status. The fast lane must pass from a shallow checkout
        # without depending on historical unreachable objects.
        run: |
          git rev-parse --is-shallow-repository
          git rev-parse HEAD
          git status --short
          echo "branch=$(git branch --show-current)"

      - name: Bootstrap git hooks
        run: make bootstrap

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/leamas ./cmd/leamas

      - name: Run gate-fast
        run: make gate-fast

  factory-fresh-clone-portability:
    name: Factory Fresh-Clone Portability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build source binary in worktree
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/leamas ./cmd/leamas

      - name: Run gate-fast in depth-one clone
        # Reproduce the CI fast lane against a depth-one clone of a
        # local bare remote. The clone has no fetches to GitHub, no
        # full history, and no alternates; gate-fast must pass.
        run: make gate-fast-shallow-clone

  factory-dupcode:
    name: Factory Dupcode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Dupcode CI preflight
        run: |
          echo "=== Dupcode CI Preflight ==="
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "CI: $CI"
          echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "HEAD: $(git rev-parse HEAD^{commit})"
          echo "tree OID: $(git rev-parse HEAD^{tree})"
          echo "worktree: $(git status --porcelain=v1 | head -1 || echo 'clean')"

          # Exact-SHA preflight
          test "$GITHUB_ACTIONS" = "true" || { echo "ERROR: GITHUB_ACTIONS != true"; exit 1; }
          test "$CI" = "true" || { echo "ERROR: CI != true"; exit 1; }
          test -n "$GITHUB_SHA" || { echo "ERROR: GITHUB_SHA is empty"; exit 1; }
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA" || { echo "ERROR: HEAD != GITHUB_SHA"; exit 1; }
          test -z "$(git status --porcelain=v1)" || { echo "ERROR: worktree is dirty"; exit 1; }

          echo "=== Preflight passed ==="

      - name: Run gate-dupcode
        env:
          LEAMAS_DUPCODE_AUTHORITY: github-actions
        run: |
          echo "=== Dupcode Execution Context ==="
          echo "LEAMAS_DUPCODE_AUTHORITY: $LEAMAS_DUPCODE_AUTHORITY"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "HEAD commit: $(git rev-parse HEAD^{commit})"
          echo "tree OID: $(git rev-parse HEAD^{tree})"
          echo "Starting dupcode at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make gate-dupcode
          DUPECODE_EXIT=$?
          echo "Dupcode finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Dupcode exit code: $DUPECODE_EXIT"
          exit $DUPECODE_EXIT

  factory-long:
    name: Factory Long
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run registered long tests
        run: make test-long
